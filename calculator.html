<!DOCTYPE html>
<html>
<head>
	<title>calculator</title>
	<link rel="icon" href="https://i.pinimg.com/236x/c0/68/99/c06899e3840e6c0d9ea88ecf1760d0c7.jpg">
	<link rel="stylesheet" href="calculator.css">
</head>
<body>
	<form>
	<div class="calc">
		<div class="one">
			<input type="text" name="display">
		</div>
		<div class="two">
			<input type="button" name="ON" value="ON" onclick="display.value =''">
			<input type="button" name="AC" value="AC" onclick="display.value =''">
			<input type="button" name="DE" value="DE" onclick="display.value =display.value.toString().slice(0,-1)">
			<input type="button" name="OFF" value="OFF" onclick="display.value =''">
			<button style="padding: 14px; background-color: black; color: white; border-radius: 8px; border: 2px solid grey; 
			box-shadow: 2px 2px 3px grey;"	onclick="display.value +='( )'">( )</button>

		</div>
		<div class="three">
			<input type="button" name="7" value="7" onclick="display.value +='7'">
			<input type="button" name="8" value="8" onclick="display.value +='8'">
			<input type="button" name="9" value="9"	onclick="display.value +='9'">
			<input type="button" name="+" value="+"	onclick="display.value +='+'">
			<input type="button" name="/" value="/"	onclick="display.value +='/'">


		</div>
		<div class="four">
			<input type="button" name="4" value="4" onclick="display.value +='4'">
			<input type="button" name="5" value="5"	onclick="display.value +='5'">
			<input type="button" name="6" value="6" onclick="display.value +='6'">
			<input type="button" name="-" value="-"	onclick="display.value +='-'">
			<input type="button" name="%" value="%" class="tage" onclick="display.value +='%'">


		</div>
		<div class="five">
			<input type="button" name="1" value="1" onclick="display.value +='1'">
			<input type="button" name="2" value="2"	onclick="display.value +='2'">
			<input type="button" name="3" value="3"	onclick="display.value +='3'">
			<input type="button" name="*" value="*"	onclick="display.value +='*'">
			<input type="button" name="^" value="^"	onclick="display.value +='^'">

		</div>
		<div class="six ">
			<input type="button" name="0" value="0"	onclick="display.value +='0'">
			<input type="button" name="." value="."	onclick="display.value +='.'">
			<input type="button" name="=" value="="	onclick="display.value =eval(display.value)">
			<input type="button" name="Aw" value="Ans" class="ans" onclick="display.value =eval(display.value)">

		</div>
	</div>
</form> 
</body>
</html>
